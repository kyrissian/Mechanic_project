name: Mechanic Shop API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest suite with coverage
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run unittest suite
        run: python -m unittest discover tests

      - name: Run Pylint
        run: python -m pylint app tests config.py

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to production
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

  rollback:
    name: Roll Back Failed Deploy
    needs: deploy
    runs-on: ubuntu-latest
    if: failure() && needs.deploy.result == 'failure'

    steps:
      - name: Find last known-good deploy
        id: last_good
        run: |
          set -euo pipefail
          DEPLOY_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.SERVICE_ID }}/deploys?status=live&limit=1" \
            | python3 -c "import json, sys; items = json.load(sys.stdin); print(items[0]['deploy']['id'] if items else '')")

          if [ -z "$DEPLOY_ID" ]; then
            echo "No prior live deploy found -- nothing to roll back to."
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Roll back to that deploy
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"deployId\": \"${{ steps.last_good.outputs.deploy_id }}\"}" \
            "https://api.render.com/v1/services/${{ secrets.SERVICE_ID }}/rollback"
