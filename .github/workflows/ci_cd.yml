name: Mechanic Shop API CI/CD

# Originally added ahead of any assignment requiring it, carrying
# over CI/CD habits from The Daily Haul into backend work too. The
# "Intro to CI/CD and GitHub Actions" lesson later made a workflow
# like this an explicit requirement -- this file already satisfied
# it, so it was extended (both test suites, a lint gate) rather than
# replaced. The "API Deployment and CI/CD Pipeline" assignment later
# added the deploy job below, gated on the test job succeeding first.
#
# Render also offers a built-in "After CI Checks Pass" auto-deploy
# option that reads GitHub's check status directly, with no deploy
# job or secrets required at all -- genuinely simpler, but entirely
# Render-specific. The explicit GitHub Actions deploy job below is
# used instead, both because the assignment requires it by name and
# because this checkout -> build -> test -> gated-deploy shape is the
# general CI/CD pattern that transfers to any hosting provider, not
# just this one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      # Step 1: pull down repository code for this job.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: use a consistent Python version and cache pip data.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Step 3: install dependencies from requirements.txt.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: run the primary test suite (pytest). Tests use an
      # in-memory SQLite database (TestingConfig), never a real MySQL
      # server -- so no database service or .env secrets are needed
      # here at all.
      - name: Run pytest suite
        run: python -m pytest -v

      # Step 5: run the second, unittest-based suite separately. This
      # suite lives in tests/unittest_suite/ and is deliberately
      # excluded from pytest's own collection (see conftest.py's
      # collect_ignore) to avoid double-counting -- so it needs its
      # own explicit step here, or it would never actually run in CI
      # at all.
      - name: Run unittest suite
        run: python -m unittest discover tests

      # Step 6: lint gate. Runs after both test suites so a broken
      # test fails fast, before spending time on style checks.
      - name: Run Pylint
        run: python -m pylint app tests config.py

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    # Only deploy on an actual push to main -- a pull request can run
    # the test job (so reviewers see pass/fail before merging), but
    # should never trigger a real deployment of unmerged code.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to production
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
